<!DOCTYPE html>
<html lang="en">
<head>
    <title> RYUG login </title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-yEPZ7jP9S0QKiUQ0m3jjsO4ProIW7wvR9gXkI7JOGa2XVsw53Yke2bsdkBbjmmiX" crossorigin="anonymous">
    <link href="../css/style.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Joti+One&family=Playpen+Sans:wght@100..800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-yEPZ7jP9S0QKiUQ0m3jjsO4ProIW7wvR9gXkI7JOGa2XVsw53Yke2bsdkBbjmmiX" crossorigin="anonymous">
    <script type="module" src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js" integrity="sha384-1a/pXj49ZQ1aHEmrJ+gMw1otqoVsYwlEnlD8mIfY2TV03r20Y0CN7uqx1tQogjPL" crossorigin="anonymous"></script>
</head>
<body>
    <header class="d-flex align-items-center justify-content-between">
        <ul class="nav">
            <li class="nav-item">
                <a class="nav-link active" aria-current="page" href="login.html">login</a>
            </li>
            <li class="nav-item">
                <a class="nav-link" href="store.html">store</a>
            </li>
            <li class="nav-item">
                <a class="nav-link" href="discount.html">discount</a>
            </li>
            <li class="nav-item">
                <a class="nav-link" href="history.html">history</a>
            </li>
        </ul>
        <div class="joti-one-regular" id="logo">RYUG</div>
    </header>
      

    <div class="container text-center" id="login-form">
        <div class="row align-items-center">
            <div class="col-md-3">
                <figure id="advertisement">
                    <img src="../static/gif/FruitAd.gif" alt="Failed to load advertisement">
                    <figcaption>Ad.</figcaption>
                </figure>
            </div>
            <div class="col">
                <h1> Login </h1>
                <form>
                    <div class="mb-3">
                        <label for="exampleInputEmail1" class="form-label">Email address</label>
                        <input type="email" class="form-control" id="exampleInputEmail1" aria-describedby="emailHelp">
                        <div id="emailHelp" class="form-text">Please enter email</div>
                    </div>
                    <div class="mb-3">
                        <label for="exampleInputPassword1" class="form-label">Password</label>
                        <input type="password" class="form-control" id="exampleInputPassword1">
                        <div id="emailHelp" class="form-text">Please enter password (hint! password is a terrible password)</div>

                    </div>
                
                    <button type="button" class="btn" id="login-button">Login</button>
                </form>
            </div>
            <div class="col-md-3">
                <figure id="advertisement">
                    <video autoplay loop>
                        <source src="../static/video/phoneAd.mp4" type="video/mp4" >
                            Video not supported.
                    </video>
                    <figcaption>Ad.</figcaption>
                </figure>
            </div>
        </div>
    </div>
    
</body>
<script src="../js/login.js"></script>
</html>
